<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Listings</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="preconnect" href="https://maccencheong.github.io">
</head>
<body>

<h1>Maccen Property Listings</h1>

<div class="toolbar">
  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search price, e.g. 1.2m / 1200k / 1,200,000..."
      autocomplete="off"
    >
  </div>

  <div class="sort-box">
    <select id="sortSelect">
      <option value="default">Default</option>
      <option value="price-low-high">Price: Low to High</option>
      <option value="price-high-low">Price: High to Low</option>
      <option value="size-low-high">Size: Low to High</option>
      <option value="size-high-low">Size: High to Low</option>
    </select>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <div class="filter-condition">
    <select id="filterCondition">
      <option value="">All Conditions</option>
      <option>Fully Furnished</option>
      <option>Partially Furnished</option>
      <option>Not Furnished</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Main Features:</span>
    <span id="chipsMainFeatures"></span>
  </div>
  <div class="filter-group">
    <span class="filter-label">Features:</span>
    <span id="chipsFeatures"></span>
  </div>
  <div class="filter-group">
    <span class="filter-label">Furnishings:</span>
    <span id="chipsFurnishings"></span>
  </div>
  <button class="clear-filters" id="clearFilters" style="display:none">✕ Clear</button>
</div>

<div id="listings"></div>
<div id="pagination"></div>
<div id="property"></div>

<script src="script.js"></script>
</body>
</html>
